services:
  db:
    image: postgres:18
    container_name: keitaro-wrapper
    restart: unless-stopped
    environment:
      POSTGRES_DB: keitaro_wrapper
      POSTGRES_USER: web
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web -d keitaro_wrapper"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: